<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 면접 대비 · 활동 아카이브</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">나의<br>면접 대비</div>
    <nav id="nav">
      <button data-page="archive" class="active">▣ <span>활동 아카이브</span></button>
      <button data-page="general">□ <span>공통 면접 질문</span></button>
      <button data-page="notes">▱ <span>메모·회고</span></button>
      <button data-page="dashboard">▥ <span>대시보드</span></button>
      <button data-page="favorites">☆ <span>즐겨찾기</span></button>
      <button data-page="map">♧ <span>Activity Map</span></button>
      <button data-page="random">⤨ <span>랜덤 면접</span></button>
      <button data-page="review">▱ <span>Quick Review</span></button>
      <button data-page="export">⇩ <span>내보내기</span></button>
    </nav>
    <div class="side-bottom">
      <button id="themeBtn">◐ <span>다크 모드</span></button>
      <small>● 이 브라우저에 저장</small>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <div class="crumb">▣ &nbsp; 나의 워크스페이스 / <span id="crumb">활동 아카이브</span></div>
      <div class="header-right"><span>이 브라우저에 저장 · ✓</span><button id="logout" class="outline">초기화</button></div>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle">활동 등록</h2><button id="closeModal">×</button></div>
    <form id="activityForm">
      <input type="hidden" id="editId">
      <label>활동 제목<input id="fTitle" required placeholder="예: 노인 운동 피드백 앱 개발"></label>
      <div class="two">
        <label>분류<select id="fCategory"><option>진로</option><option>탐구</option><option>과학</option><option>수학</option><option>정보</option><option>동아리</option><option>봉사</option><option>기타</option></select></label>
        <label>학년/시기<input id="fPeriod" placeholder="예: 2학년 / 자율활동"></label>
      </div>
      <label>활동 내용<textarea id="fDesc" required placeholder="무엇을 했는지 구체적으로 작성"></textarea></label>
      <div class="two">
        <label>나의 역할<input id="fRole" placeholder="예: 데이터 분석 및 모델 구현"></label>
        <label>키워드<input id="fTags" placeholder="AI, 생체역학, Python"></label>
      </div>
      <label>배운 점 / 한계 / 확장<textarea id="fLearn" placeholder="무엇을 배웠고 무엇을 개선할지"></textarea></label>
      <div class="modal-actions"><button type="button" class="outline" id="cancelModal">취소</button><button class="black">저장</button></div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
